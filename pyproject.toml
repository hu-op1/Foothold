[project]
name = "foothold"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy",
    "scipy>=1.15.0",
    "openpyxl>=3.1.0",
    "pyyaml>=6.0.3",
    "torch==2.10.0",
    "tqdm>=4.65.0",
    "transformers",
    "datasets",
    "teich>=0.2.8",
    "matplotlib",
    "openai>=2.48.0",
]

[project.optional-dependencies]
# CUDA-required extras — Linux-only (no wheels for Windows).
# Merged `linux` extra: flash-attn + fla (flash-linear-attention + causal-conv1d,
# Fused Gated DeltaNet kernels) + embedded vLLM (validate/send.py embedded mode).
# The gateddelta bench prefers the fla kernels; falls back to the torch reference
# implementation (slower) when absent; re-run bench + fit after installing.
# Install with: uv sync --all-extras --no-build-isolation
# (bare `uv sync` installs only base deps and uninstalls extras; --no-build-isolation
#  builds source dists against the venv's torch instead of an isolated env)
# These build from source and need nvcc (CUDA toolkit) reachable, e.g.:
#   export PATH="/usr/local/cuda-12.8/bin:$PATH"
# If manual installation fails, install with the following command:
#   export MAX_JOBS=2 && uv pip install --no-build-isolation "flash-attn>=2.7.0" "flash-linear-attention" "causal-conv1d" "vllm==0.19.0"
linux = [
    "flash-attn>=2.7.0",
    "flash-linear-attention",
    "causal-conv1d",
    "vllm==0.19.0",
]
dev = [
    "pytest>=8.0",
    "vulture>=2.11",
]

[tool.uv.extra-build-dependencies]
# flash-attn needs torch at build time to compile CUDA kernels
flash-attn = ["torch"]

[tool.uv]
# xgrammar==0.2.4 has no Linux x86_64 wheel; 0.2.3 does
override-dependencies = ["xgrammar==0.2.3"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "tsinghua"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.vulture]
exclude = ["reference/", ".venv/", "__pycache__/", ".git/", ".github/", ".superpowers/", ".pytest_cache/", ".claude/"]
min_confidence = 60
paths = ["bench/", "fit/", "sim/", "models/", "tools/", "main.py"]
