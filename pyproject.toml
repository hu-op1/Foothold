[project]
name = "foothold"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy",
    "scipy>=1.15.0",
    "openpyxl>=3.1.0",
    "pyyaml>=6.0.3",
    "torch==2.10.0",
    "tqdm>=4.65.0",
    "transformers",
    "datasets",
    "teich>=0.2.8",
    "matplotlib",
    "openai>=2.48.0",
]

[project.optional-dependencies]
# FlashAttention-2/3 — Linux-only, CUDA required.
# Install with: uv sync --extra linux
linux = [
    "flash-attn>=2.7.0",
]
# Embedded vLLM benchmark (validate/send.py embedded mode).
# Linux-only — no vLLM pre-built wheels for Windows.
# Install with: uv sync --extra vllm
vllm = [
    "vllm==0.19.0",
]
dev = [
    "pytest>=8.0",
    "vulture>=2.11",
]

[tool.uv.extra-build-dependencies]
# flash-attn needs torch at build time to compile CUDA kernels
flash-attn = ["torch"]

[tool.uv]
# xgrammar==0.2.4 has no Linux x86_64 wheel; 0.2.3 does
override-dependencies = ["xgrammar==0.2.3"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "tsinghua"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.vulture]
exclude = ["reference/", ".venv/", "__pycache__/", ".git/", ".github/", ".superpowers/", ".pytest_cache/", ".claude/"]
min_confidence = 60
paths = ["bench/", "fit/", "sim/", "models/", "tools/", "main.py"]
