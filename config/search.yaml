gpu: "3090"
model: "Qwen/Qwen3-4B"
dtype: "bfloat16"  # must match a dtype in the benchmark config

communication:
  intra_bw_gb_s: 9.7    # intra-node (NVLink ~900 GB/s, PCIe ~64 GB/s)
  intra_latency_us: 2.0  # intra-node latency per hop (NVLink ~1-2 µs, PCIe ~5-10 µs)
  inter_bw_gb_s: 9.7     # inter-node (InfiniBand ~50 GB/s, Ethernet ~12.5 GB/s)
  inter_latency_us: 6.9
  cpu_swap_bw_gb_s: 9.7   # GPU↔CPU swap bandwidth (PCIe 3.0 x16 ~32 GB/s, PCIe 4.0 ~64 GB/s)

simulation:
  block_size: 16
  max_num_seqs: 32
  kv_cache_memory_gb: null  # null = auto from VRAM - model - activation
  activation_memory_gb: null  # null = auto-compute from model arch × max_batch_tokens
  gpu_memory_utilization: 0.85  # fraction of total VRAM usable for weights + KV cache
  enable_prefix_caching: true
  enable_chunked_prefill: true
  scheduling_policy: fcfs
  use_cudagraph: false  # set true after running cudagraph bench+fit
  async_scheduling: false  # enable schedule/execute overlap (auto-enabled for PP>1)
  scheduler_reserve_full_isl: true  # gate: full prompt must fit KV cache before first chunk

strategy:
  mode: both  # both / colocated / disaggregated
  nodes: null      # set to override total_gpus; total_gpus = nodes × gpus_per_node
  gpus_per_node: 8
  search:
    max_batched_tokens: [8192]
    prefill_thresholds: [8192]
    max_workers: 36  # parallel processes for strategy evaluation (1 = sequential)
    tp: true   # enable TP dimension in search
    pp: true   # enable PP dimension in search
    dp: true   # enable DP dimension in search
    # pd_ratios, tp_sizes, pp_sizes are auto-generated from total_gpus + model constraints
    gpu_sweep: [1, 2, 4, 8, 16, 32, 64, 128]  # sweep GPU counts for scalability curve (null = single run)

output: "sim/output/search.csv"
overwrite: true  # true = delete existing CSV and re-search everything

trace:
  path: "traces/agent_trace_test.jsonl"
  max_requests: 5
  format: "agentic"  # "sharegpt" or "agentic"

# ── Service Level Objectives (SLO) ──────────────────────────────────────
# SLO is a binary gate checked at p90 (not per-request, not p99).
# Both must pass — if either fails the strategy scores 0.
# Once SLO is met, strategies are ranked purely by throughput.
# Total latency is intentionally excluded — it scales with output length.
slo:
  p90_ttft_ms: 500   # p90 Time-To-First-Token threshold (ms)
  p90_tpot_ms: 50    # p90 Time-Per-Output-Token threshold (ms)
