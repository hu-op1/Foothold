gpu: "3090"
model: "meta-llama/Llama-2-7b-hf"

communication:
  intra_bw_gb_s: 9.7    # intra-node (NVLink ~900 GB/s, PCIe ~64 GB/s)
  inter_bw_gb_s: 9.7     # inter-node (InfiniBand ~50 GB/s, Ethernet ~12.5 GB/s)
  inter_latency_us: 6.9
  cpu_swap_bw_gb_s: 9.7   # GPU↔CPU swap bandwidth (PCIe 3.0 x16 ~32 GB/s, PCIe 4.0 ~64 GB/s)

simulation:
  block_size: 16
  max_num_seqs: 32
  kv_cache_memory_gb: null  # null = auto from VRAM - model - activation
  activation_memory_gb: null  # null = auto-compute from model arch × max_batch_tokens
  gpu_memory_utilization: 0.85  # fraction of total VRAM usable for weights + KV cache
  enable_prefix_caching: true
  enable_chunked_prefill: true
  scheduling_policy: fcfs

strategy:
  mode: colocated # auto/colocated/disaggregated
  total_gpus: 2
  search:
    pd_ratios: [1, 1]
    max_batched_tokens: [256, 512, 1024, 2048, 4096, 8192]
    prefill_thresholds: [256, 512, 1024, 2048]
    tp_sizes: [2]
    decode_tp_sizes: [1]   # D-side TP in disaggregated mode (null = same as tp_sizes)
    pp_sizes: [1]          # pipeline parallelism (layers split across GPUs)
    decode_pp_sizes: [1]   # D-side PP in disaggregated mode (null = same as pp_sizes)

output: "sim/output/results.xlsx"

trace:
  path: "traces/myllama-2-7b-heavy.jsonl"
  max_requests: 500
  format: "sharegpt"  # "sharegpt" or "agentic"

slo:
  ttft_ms: 500
  tpot_ms: 50
  p99_latency_ms: 10000
