gpu: "3090"
model: "Qwen/Qwen3-4B"

communication:
  intra_bw_gb_s: 9.7    # intra-node (NVLink ~900 GB/s, PCIe ~64 GB/s)
  inter_bw_gb_s: 9.7     # inter-node (InfiniBand ~50 GB/s, Ethernet ~12.5 GB/s)
  inter_latency_us: 6.9
  cpu_swap_bw_gb_s: 9.7   # GPU↔CPU swap bandwidth (PCIe 3.0 x16 ~32 GB/s, PCIe 4.0 ~64 GB/s)

simulation:
  block_size: 16
  max_num_seqs: 32
  kv_cache_memory_gb: null  # null = auto from VRAM - model - activation
  activation_memory_gb: null  # null = auto-compute from model arch × max_batch_tokens
  gpu_memory_utilization: 0.85  # fraction of total VRAM usable for weights + KV cache
  enable_prefix_caching: true
  enable_chunked_prefill: true
  scheduling_policy: fcfs

strategy:
  mode: both  # both / colocated / disaggregated
  total_gpus: 64
  search:
    max_batched_tokens: [8192]
    prefill_thresholds: [8192]
    max_workers: 8  # parallel processes for strategy evaluation (1 = sequential)
    tp: true   # enable TP dimension in search
    pp: true   # enable PP dimension in search
    dp: true   # enable DP dimension in search
    # pd_ratios, tp_sizes, pp_sizes are auto-generated from total_gpus + model constraints
    gpu_sweep: [1, 2, 4, 8, 16]  # sweep GPU counts for scalability curve (null = single run)

output: "sim/output/search.xlsx"

trace:
  path: "traces/agent_trace_test.jsonl"
  max_requests: 5
  format: "agentic"  # "sharegpt" or "agentic"

slo:
  ttft_ms: 500
  tpot_ms: 50
  p99_latency_ms: 10000
