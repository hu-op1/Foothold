# Hardware characterization benchmark config
# matmul shape grid spans both memory-bound (small M) and compute-bound (large M) regimes
# M extended to 32768 for long-context (≤32K tokens) prefill coverage
# N extended to 256M elements for long-context elementwise op coverage

matmul:
  M: [1, 2, 4, 8, 16, 32, 64, 128, 256, 512, 1024, 2048, 4096, 8192, 16384, 32768]
  K: [512, 1024, 2048, 4096, 8192]
  N: [512, 1024, 2048, 4096, 8192]

# elementwise ops for bandwidth validation, N spans 1K to 256M elements
# max N covers 256K context × 4K hidden_dim
elementwise:
  N: [1024, 2048, 4096, 8192, 16384, 32768, 65536, 131072, 262144, 524288, 1048576, 2097152, 4194304, 8388608, 16777216, 33554432, 67108864, 134217728, 268435456]
  operators: [residual_add, rmsnorm, softmax, swiglu, rope]

# FlashAttention benchmark — (s_q, s_kv) grid covering decode (s_q=1)
# through long-context prefill (s_q up to 2048, s_kv up to 262144 for 256K context).
# Large s_kv × large batch will OOM on 24GB; check_memory skips those combos.
# Uses GQA defaults (nh=32, nh_kv=8, hd=128) — representative of 7B-class models.
flashattn:
  s_q: [1, 16, 32, 64, 128, 256, 512, 1024, 2048]
  s_kv: [128, 256, 512, 1024, 2048, 4096, 8192, 16384, 32768, 65536, 131072, 262144]
  batch: [1, 4, 16, 64]
  num_heads: 32
  num_kv_heads: 8
  head_dim: 128

gpu: "3090"

dtype: "float16"
warmup_iters: 200
bench_iters: 2000
max_memory_gb: 24
