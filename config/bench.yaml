# Hardware characterization benchmark config
# matmul shape grid spans both memory-bound (small M) and compute-bound (large M) regimes
# M extended to 32768 for long-context (≤32K tokens) prefill coverage
# N extended to 256M elements for long-context elementwise op coverage

matmul:
  M: [32768, 16384, 8192, 4096, 2048, 1024, 512, 256, 128, 64, 32, 16, 8, 4, 2, 1]
  K: [8192, 4096, 2048, 1024, 512]
  N: [8192, 4096, 2048, 1024, 512]

# elementwise ops for bandwidth validation, N spans 1K to 256M elements
# max N covers 256K context × 4K hidden_dim
elementwise:
  N: [268435456, 134217728, 67108864, 33554432, 16777216, 8388608, 4194304, 2097152, 1048576, 524288, 262144, 131072, 65536, 32768, 16384, 8192, 4096, 2048, 1024]
  operators: [residual_add, rmsnorm, softmax, swiglu, rope]

# FlashAttention benchmark — (s_q, s_kv) grid covering decode (s_q=1)
# through long-context prefill (s_q up to 65536, s_kv up to 262144 for 256K context).
# Large s_kv × large batch will OOM on 24GB; check_memory skips those combos.
# Uses GQA defaults (nh=32, nh_kv=8, hd=128) — representative of 7B-class models.
flashattn:
  s_q: [32768, 16384, 8192, 4096, 2048, 1024, 512, 256, 128, 64, 32, 16, 1]
  s_kv: [262144, 131072, 65536, 32768, 16384, 8192, 4096, 2048, 1024, 512, 256, 128]
  batch: [64, 16, 4, 1]
  num_heads: 32
  num_kv_heads: 8
  head_dim: 128

gpu: "3090"

# Precision sweep.  fp8 requires Hopper+ (H100/H200/B200); silently OOM/skip on
# older GPUs.  int8/int4 weight-only quant uses dedicated dequant+compute codepaths
# (torch._int_mm, custom CUDA) — not covered by standard torch.mm / SDPA bench.
dtype: ["float16", "bfloat16"]
warmup: auto            # "auto" = 1/10 of estimated benchmark iters, or an int for fixed
warmup_ratio: 0.1        # fraction of estimated iters used when warmup=auto
# Time-budgeted measurement: run enough iterations to accumulate ≥500ms
# of GPU time, capped at max_iters.  Adapts per-kernel so a 5µs rmsnorm
# gets ~10k samples while a 50ms matmul stops after ~4 samples.
min_time_ms: 1000
max_iters: 100000
calib_iters: 20  # initial calibration batch — higher = more accurate per-iter estimate
overwrite: true  # true = delete existing CSV and re-benchmark everything
max_memory_gb: 24

# ── CUDA Graph replay benchmark ──────────────────────────────────────────
# Measures each op under CUDA Graph replay.  Graph replay eliminates per-kernel
# CPU→GPU dispatch overhead (~5–10 µs each), producing "clean" roofline params
# that reflect true hardware limits.  The fitted cudagraph params are used by
# the simulator for decode steps when CUDA Graph is active.
#
# Grids default to the eager benchmark grids above if not specified.
cudagraph:
  matmul:
    M: [32768, 16384, 8192, 4096, 2048, 1024, 512, 256, 128, 64, 32, 16, 8, 4, 2, 1]
    K: [8192, 4096, 2048, 1024, 512]
    N: [8192, 4096, 2048, 1024, 512]
  elementwise:
    N: [268435456, 134217728, 67108864, 33554432, 16777216, 8388608, 4194304, 2097152, 1048576, 524288, 262144, 131072, 65536, 32768, 16384, 8192, 4096, 2048, 1024]
    operators: [residual_add, rmsnorm, swiglu, rope]
  flashattn:
    s_q: [8192, 4096, 2048, 1024, 512, 256, 128, 64, 32, 16, 1]
    s_kv: [32768, 16384, 8192, 4096, 2048, 1024, 512, 256, 128]
    batch: [64, 16, 4, 1]
    num_heads: 32
    num_kv_heads: 8
    head_dim: 128

# ── Kernel launch overhead benchmark ─────────────────────────────────────
# Measures CPU→GPU kernel dispatch overhead using CPU wall-clock vs GPU
# event timing (CudaTimer sees only GPU-side time).  The slope method
# runs a trivial kernel at varying batch sizes N and regresses CPU and
# GPU times against N; the slope difference is the per-launch overhead.
#
# kernel_launch_overhead_us is stored in fitted_params.json and used by
# sim/executor.py:predict_step() to add per-step dispatch cost.  This
# cost is zero when CUDA Graph is active (graph replay = 1 host launch).
#
# Set this section to null (or remove it) to skip the benchmark:
#   launch_overhead: null
launch_overhead:
  n_values: [10, 50, 100, 200, 500, 1000]  # kernel counts for slope analysis
  trials: 5                                   # measurement trials per N (median taken)
  warmup: 10                                  # warmup iterations
