# Hardware characterization benchmark config
# matmul shape grid spans both memory-bound (small M) and compute-bound (large M) regimes
# M extended to 32768 for long-context (≤40K tokens) prefill coverage
# N extended to 128M elements for long-context elementwise op coverage

matmul:
  M: [1, 2, 4, 8, 16, 32, 64, 128, 256, 512, 1024, 2048, 4096, 8192, 16384, 32768]
  K: [512, 1024, 2048, 4096, 8192]
  N: [512, 1024, 2048, 4096, 8192]

# elementwise ops for bandwidth validation, N spans 1K to 128M elements
elementwise:
  N: [1024, 2048, 4096, 8192, 16384, 32768, 65536, 131072, 262144, 524288, 1048576, 2097152, 4194304, 8388608, 16777216, 33554432, 67108864, 134217728]
  operators: [residual_add, rmsnorm, softmax, swiglu, rope]

gpu: "3090"

dtype: "float16"
warmup_iters: 200
bench_iters: 2000
max_memory_gb: 24
