# Single-run simulation config for time-series output.
# Structure mirrors search.yaml but with scalar strategy values (no grid search).

gpu: "3090"
model: "meta-llama/Llama-2-7b-hf"
dtype: "float16"  # must match a dtype in the benchmark config

# ── Communication model ──────────────────────────────────────────────
# Two models for GPU-to-GPU communication:
#   "bw_latency" — bandwidth + latency model (intra_bw_gb_s / intra_latency_us)
#   "lut"        — measured D2H memcpy lookup table from fitted_params
# The LUT model requires running --bench then --fit to generate the LUT.
communication:
  model: "bw_latency"
  intra_bw_gb_s: 9.7
  intra_latency_us: 6.9   # NVLink/PCIe intra-node latency per hop
  inter_bw_gb_s: 0.05
  inter_latency_us: 690   # cross-node (InfiniBand/Ethernet) latency per hop
  cpu_swap_bw_gb_s: 9.7   # GPU↔CPU swap bandwidth (preemption)

simulation:
  block_size: 16
  max_num_seqs: 256
  max_num_batched_tokens: 2048
  kv_cache_memory_gb: null
  activation_memory_gb: null
  gpu_memory_utilization: 0.89
  enable_prefix_caching: true
  enable_chunked_prefill: true
  long_prefill_token_threshold: 2048
  scheduling_policy: fcfs
  use_cudagraph: true  # set true after running cudagraph bench+fit
  async_scheduling: true  # enable schedule/execute overlap (auto-enabled for PP>1)
  scheduler_reserve_full_isl: true  # gate: full prompt must fit KV cache before first chunk
  enable_expert_parallel: true  # enable Expert Parallelism for MoE models (EP_SIZE = TP × DP)

strategy:
  mode: colocated       # colocated or disaggregated

  nodes: 1               # number of nodes (overrides total_gpus)
  gpus_per_node: 2       # GPUs per node (total_gpus = nodes × gpus_per_node)

  # colocated:
  tp_size: 2
  pp_size: 1
  dp_size: 1              # data-parallel replicas (explicit — total_gpus = dp × tp × pp)
  enable_ep: false        # enable EP for MoE models

  # disaggregated:
  pd_ratio: [1, 1]          # [num_prefill_gpus, num_decode_gpus]
  p_tp_size: 1              # P-side TP
  p_pp_size: 1              # P-side PP
  d_tp_size: 1              # D-side TP
  d_pp_size: 1              # D-side PP

output: "sim/output/try"  # output directory for timeseries.csv, requests.jsonl, sim.log
tick_seconds: 0.5            # timeseries downsampling interval

trace:
  path: "traces/myllama-2-7b-heavy.jsonl"
  max_requests: 5000
  format: "sharegpt"  # "agentic" or "sharegpt"

# ── Service Level Objectives (SLO) ──────────────────────────────────────
# SLO is a binary gate checked at p90 (not per-request, not p99).
# Both must pass — if either fails the strategy scores 0.
# Once SLO is met, strategies are ranked purely by throughput.
# Total latency is intentionally excluded — it scales with output length.
slo:
  p90_ttft_ms: 500   # p90 Time-To-First-Token threshold (ms)
  p90_tpot_ms: 50    # p90 Time-Per-Output-Token threshold (ms)
