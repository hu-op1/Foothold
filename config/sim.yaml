# Single-run simulation config for time-series output.
# Structure mirrors search.yaml but with scalar strategy values (no grid search).

gpu: "3090"
model: "meta-llama/Llama-2-7b-hf"
dtype: "float16"  # must match a dtype in the benchmark config

communication:
  intra_bw_gb_s: 9.7
  intra_latency_us: 2.0  # intra-node latency per hop (NVLink ~1-2 µs)
  inter_bw_gb_s: 9.7
  inter_latency_us: 6.9
  cpu_swap_bw_gb_s: 9.7

simulation:
  block_size: 16
  max_num_seqs: 256
  max_num_batched_tokens: 2048
  kv_cache_memory_gb: null
  activation_memory_gb: null
  gpu_memory_utilization: 0.85
  enable_prefix_caching: true
  enable_chunked_prefill: true
  long_prefill_token_threshold: 2048
  scheduling_policy: fcfs
  use_cudagraph: false  # set true after running cudagraph bench+fit

strategy:
  mode: colocated       # colocated or disaggregated

  total_gpus: 2

  # colocated:
  tp_size: 2
  pp_size: 1

  # disaggregated:
  pd_ratio: [1, 1]          # [num_prefill_gpus, num_decode_gpus]
  p_tp_size: 1              # P-side TP
  p_pp_size: 1              # P-side PP
  d_tp_size: 1              # D-side TP
  d_pp_size: 1              # D-side PP

output: "sim/output/llama-2-7b-tp2-sharegpt"
tick_seconds: 0.5            # timeseries downsampling interval

trace:
  path: "traces/myllama-2-7b-heavy.jsonl"
  max_requests: 500
  format: "sharegpt"  # "agentic" or "sharegpt"

# ── Service Level Objectives (SLO) ──────────────────────────────────────
# SLO is a binary gate checked at p90 (not per-request, not p99).
# Both must pass — if either fails the strategy scores 0.
# Once SLO is met, strategies are ranked purely by throughput.
# Total latency is intentionally excluded — it scales with output length.
slo:
  p90_ttft_ms: 500   # p90 Time-To-First-Token threshold (ms)
  p90_tpot_ms: 50    # p90 Time-Per-Output-Token threshold (ms)
