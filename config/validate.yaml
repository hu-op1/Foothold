# Validate config for --validate.
# Used by: uv run python main.py --validate [--vllm] [--compare]

# ── Sim output (required) ──
sim_dir: sim/output/try

# ── Comparison data (optional, used by --compare) ──
# If null, that source is excluded from comparison.
sim_csv: sim\output\llama-2-7b-tp2-sharegpt\llama-2-7b-tp2-sharegpt.csv                                          # LLMServingSim sim.csv
sim_log: sim\output\llama-2-7b-tp2-sharegpt\llama-2-7b-tp2-sharegpt.log                                          # LLMServingSim sim.log
vllm_dir: sim\output\llama-2-7b-tp2-sharegpt\vllm                                         # vLLM send output dir
compare_dir: sim\output\llama-2-7b-tp2-sharegpt                                      # Comparison output dir (default: sim_dir)

# ── Plot colors (hex) ──
colors:
  foothold: "#00BCD4"          # C0 blue
  llmservingsim: "#7B1FA2"     # purple
  vllm: "#FF8F00"              # C2 green

title: "llama-2-7b-tp2-sharegpt"                     # Plot title suffix
prefix: "tp2"                                          # Output filename prefix

# ── vLLM send (--validate --vllm) ──
vllm:
  # Set to true for embedded mode: spawns vLLM AsyncLLM in-process
  # with custom StatLoggerBase for per-iteration stats (accurate
  # throughput, no /metrics polling).  Requires dedicated GPUs —
  # cannot coexist with a running vLLM server.
  embedded: false
  # OpenAI-compatible API base URL (ignored when embedded: true)
  endpoint: "http://localhost:8000/v1"
  # Required: model name served by vLLM
  model: Qwen/Qwen3.5-4B
  # Auto from OPENAI_API_KEY env if null
  api_key: dummy
  # Per-request timeout seconds
  timeout: 600
  # Max concurrent in-flight API calls
  # Trace timestamps control when, this controls how many at once.
  max_concurrency: 256
  # Required: path to JSONL trace file
  trace_path: traces/qwen35-4b-conversation.jsonl
  # "sharegpt" or "agentic"
  trace_format: agentic
  # Cap on trace requests (null = all)
  max_requests: null
  # Tokenizer HF ID (defaults to model if null)
  tokenizer: null
  # Output directory for vLLM results
  output_dir: sim/output/try
  # Timeseries bucket size (seconds)
  tick_seconds: 0.5

  # ── Server mode (embedded: false) ──
  # With embedded: false the sender talks to an OpenAI-compatible vLLM server
  # at `endpoint`.  If nothing answers there, the server is started
  # automatically from `engine_args` (incl. the optional server flags below),
  # waited until ready, then shut down after the run.  A server already
  # running at the endpoint is reused and left untouched.
  #   embedded: true  -> AsyncLLM in-process (raw token prompts, no chat template)
  #   embedded: false -> external `vllm serve` via /v1/chat/completions
  #                      (chat template applied -> enable_thinking honored)

  # ── Engine / server args (embedded engine AND auto-spawned serve) ──
  engine_args:
    tensor_parallel_size: 1
    pipeline_parallel_size: 1
    data_parallel_size: 1
    max_num_seqs: 256
    max_num_batched_tokens: 2048
    max_model_len: null         # null = model default
    dtype: float16
    kv_cache_dtype: auto
    seed: 42
    enable_prefix_caching: true
    load_format: dummy
    enforce_eager: false
    gpu_memory_utilization: 0.89

    # ── Optional server flags (mirror vLLM serve CLI names) ──
    # Only load the language model, skipping vision/multimodal towers
    # (vLLM serve --language-model-only).
    language_model_only: true
    # Reasoning parser for splitting reasoning/content from outputs
    # (vLLM serve --reasoning-parser).  "qwen3" for Qwen3-style reasoning.
    # Set to null to omit the --reasoning-parser flag entirely.
    reasoning_parser: qwen3
    # Default chat-template kwargs for the OpenAI chat frontend
    # (vLLM serve --default-chat-template-kwargs) — disables Qwen thinking.
    # Only applies in external serve mode (embedded: false); the embedded
    # engine sends raw token prompts and applies no chat template.
    default_chat_template_kwargs: {"enable_thinking": false}
