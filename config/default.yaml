# Hardware characterization benchmark config
# matmul shape grid spans both memory-bound (small M) and compute-bound (large M) regimes

matmul:
  M: [1, 2, 4, 8, 16, 32, 64, 128, 256, 512, 1024, 2048, 4096, 8192]
  K: [512, 1024, 2048, 4096, 8192]
  N: [512, 1024, 2048, 4096, 8192]

# elementwise ops for bandwidth validation, N spans 1K to 16M elements
elementwise:
  N: [1024, 4096, 16384, 65536, 262144, 1048576, 4194304, 16777216]
  operators: [residual_add, rmsnorm, softmax]

dtype: "float16"
warmup_iters: 200
bench_iters: 500
max_memory_gb: 6
