gpu: "3090"
model: "Llama-2-7B"

communication:
  intra_bw_gb_s: 900    # intra-node (NVLink ~900 GB/s, PCIe ~64 GB/s)
  inter_bw_gb_s: 50     # inter-node (InfiniBand ~50 GB/s, Ethernet ~12.5 GB/s)
  inter_latency_us: 2

simulation:
  max_num_batched_tokens: 8192
  max_num_seqs: null  # null = auto from KV budget
  block_size: 16
  kv_cache_memory_gb: null
  enable_chunked_prefill: true
  long_prefill_token_threshold: 1024
  scheduling_policy: fcfs

strategy:
  mode: auto
  total_gpus: 8
  workers: 2
  search:
    pd_ratios: [[1, 1], [1, 3], [1, 7], [3, 5]]
    max_batched_tokens: [256, 512, 1024, 2048, 4096, 8192]
    prefill_thresholds: [256, 512, 1024, 2048]
    tp_sizes: [1, 2, 4]

trace:
  path: "traces/myllama-2-7b.jsonl"
  max_requests: null

slo:
  ttft_ms: 500
  tpot_ms: 50
  p99_latency_ms: 2000
