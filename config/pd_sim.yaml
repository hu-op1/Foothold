gpu: "3090"

communication:
  intra_node: nvlink
  inter_node: infiniband
  bandwidth_gb_s: 50
  latency_us: 2

simulation:
  max_num_batched_tokens: 8192
  max_num_seqs: 256
  block_size: 16
  kv_cache_memory_gb: null
  enable_chunked_prefill: true
  long_prefill_token_threshold: 1024
  scheduling_policy: fcfs

strategy:
  mode: auto
  total_gpus: 8
  workers: 4
  search:
    pd_ratios: [[1, 1], [1, 3], [1, 7], [3, 5]]
    chunk_sizes: [256, 512, 1024, 2048]
    max_batched_tokens: [2048, 4096, 8192]

trace:
  path: "traces/myllama-2-7b.jsonl"
  max_requests: null

slo:
  ttft_ms: 500
  tpot_ms: 50
  p99_latency_ms: 2000
